<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8"/>
		<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
		<title>Document</title>
		<style>
			body{
				background-color:#f6f6f6;
				display:flex;
				justify-content:center;
				align-items:center;
				height:100vh;
			}
			.left{
				width:450px;
				margin-top:70px;
				display:inline-block;
			}
			form{
				display:flex;
				flex-direction:column;
				background-color:white;
				padding:20px;
				border-radius:5px;
				box-shadow:0 0 10px #ccc;
				gap:10px;
				width:300px;
			}
			input{
				border:1px solid #ccc;
				border-radius:5px;
				padding:10px;
			}
			a{
				text-decoration:none;
				color:#1877f2;
			}
			.signup{
				background-color:#42b72a;
				color:white;
				border-radius:5px;
				padding:10px;
			}
			.submit{
				background-color:#1877f2;
				width:100%; 
				color:white; 
				border-radius:5px; 
				padding:10px;
			}
		</style>
	</head>
	<body>
		<div class="left">
			<img src="https://static.xx.fbcdn.net/rsrc.php/y8/r/dF5SId3UHWd.svg" alt="Facebook logo"/>
			<p>Facebook helps you connect and share with the people in your life.</p>
		</div>
		<div class="right">
			<form>
				<input type="text" id="email" placeholder="Email address or phone number"/>
				<input type="password" id="password" placeholder="Password"/>
				<input type="submit" value="Log in" class="submit"/>
				<a>Forgotten account?</a>
				<button class="signup">Create new account</button>
			</form>
		</div>
	</body>
</html>
