<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
		<title>Facebook Login</title>
		<style>
			body{
				background-color:#f6f6f6;
				display:flex;
				justify-content:center;
				height:100vh;
				align-items:center;
			}
			.left{
				width:450px;
				margin-top:70px;
				display:inline-block;
			}
			form{
				display:flex;
				width:300px;
				background-color:white;
				padding:20px;
				border:1px solid black;
				border-radius:5px;
				box-shadow:0 0 10px #ccc;
				flex-direction:column;
				gap:10px;
			}
			input{
				border:1px solid #ccc;
				border-radius:5px;
				padding:10px;
			}
			button{
				background-color:#42b72a;
				border:1px solid black;
				border-radius:5px;
				padding: 10px 20px;
                color:white;
				
			}
			a{
				text-decoration:none;
				color:#1877f2;
			}
			.signup{
				background-color:#1877f2;
				border:1px solid black;
				border-radius:5px;
				padding: 10px 20px;
                color:white;
			}
		</style>
		
	</head>
	<body>
		<div class="left">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR4_I3X_gc4ZZJXotAvtnCBrx9mpIbykKpJSXyFmrjHEw&s=10" alt="facebook logo" height="150px" width="300px" />	
			<p>Facebook helps you connect and share with the people in your life.</p>
		</div>
		<div class="right">
			<form>
				<input type="text" id="email" placeholder="Email address or phone number"/>
				<input type="password" id="password" placeholder="Password"/>
				<input type="submit" value="Log in" class="signup"/>
				<a>Forgotten account?</a>
				<button>Create new account</button>
			</form>
			
		</div>
		
	</body>
</html>
